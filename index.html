<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles/styles.css">
    <title>Signup Form</title>
</head>

<body>
    <div class="left">
        <div class="image-wrapper">
            <div class="image-text-container">
                <h1>Mada</h1>
            </div>
        </div>
    </div>
    <div class="right">
        <div class="attention">
            <p>
                Attention its not a real signup page for mada!<br>
                In case you really want to join
                <a href="https://www.mdais.org/">click here!</a>
            </p>

            <p>You know you want to!</p>
        </div>

        <div class="form-wrapper">
            <form class="signup-form">
                <legend class="form-header">Let's save a life!</legend>

                <div class="field">
                    <label for="first_name">FIRST NAME</label>
                    <input type="text" name="first_name" id="first_name">
                </div>

                <div class="field">
                    <label for="last_name">LAST NAME</label>
                    <input type="text" name="last_name" id="last_name">
                </div>

                <div class="field">
                    <label for="email">EMAIL</label>
                    <input type="email" name="email" id="email">
                </div>

                <div class="field">
                    <label for="phone_number">PHONE NUMBER</label>
                    <input type="text" name="phone_number" id="phone_number">
                </div>

                <div class="field">
                    <label for="password">* PASSWORD</label>
                    <input type="password" name="password" id="password" required min="9" max="16">
                </div>

                <div class="field">
                    <label for="confirm_password">* CONFIRM PASSWORD</label>
                    <input type="password" name="confirm_password" id="confirm_password" required min="9" max="16">
                </div>

                <button class="submit-button" type="submit">Create Account</button>
            </form>
        </div>

        <p>Already have an account? <a href="#">Log in</a></p>
    </div>
</body>

</html>
